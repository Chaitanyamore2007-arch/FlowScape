<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowScape Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c1c7d2",
                        "on-secondary-fixed-variant": "#004f4f",
                        "secondary-fixed-dim": "#84d4d3",
                        "inverse-surface": "#2e3135",
                        "inverse-on-surface": "#eff0f6",
                        "surface-bright": "#f8f9ff",
                        "surface-variant": "#e1e2e8",
                        "surface-container": "#eceef3",
                        "on-secondary": "#ffffff",
                        "primary-container": "#0061a4",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e7e8ee",
                        "inverse-primary": "#9fcaff",
                        "on-surface": "#191c20",
                        "secondary-fixed": "#a0f0f0",
                        "surface-dim": "#d8dae0",
                        "on-secondary-fixed": "#002020",
                        "on-primary-container": "#c0dbff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#00497d",
                        "primary-fixed-dim": "#9fcaff",
                        "surface-tint": "#0061a4",
                        "tertiary-fixed": "#e6e1e7",
                        "tertiary-container": "#605d62",
                        "outline": "#717782",
                        "on-background": "#191c20",
                        "on-tertiary-container": "#dcd6dc",
                        "secondary-container": "#9deeed",
                        "on-primary": "#ffffff",
                        "tertiary": "#48464a",
                        "secondary": "#006a6a",
                        "on-primary-fixed": "#001d36",
                        "on-surface-variant": "#414750",
                        "primary-fixed": "#d1e4ff",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f2f3f9",
                        "on-tertiary-fixed": "#1c1b1f",
                        "primary": "#00497d",
                        "surface": "#f8f9ff",
                        "background": "#f8f9ff",
                        "surface-container-highest": "#e1e2e8",
                        "tertiary-fixed-dim": "#cac5cb",
                        "on-secondary-container": "#0b6e6e",
                        "on-tertiary-fixed-variant": "#48464a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-padding": "24px",
                        "base": "8px",
                        "stack-sm": "4px",
                        "stack-md": "12px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        .gauge-meter {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
