name: Auto-Fix and Format

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Prettier
        run: npm install -g prettier

      - name: Auto-Format Code (Prettier)
        run: prettier --write "**/*.{js,jsx,json,md,css}"

      - name: Auto-Commit Formatting Fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: 🤖 Auto-format code via GitHub Actions"
          branch: main
